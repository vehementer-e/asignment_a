pipeline_id: clients_curated
version: 1
owner: data-platform
layer: silver
description: Curate raw client records into a standardized silver dataset.
engine: pyspark
schedule: "0 6 * * *"
runtime_parameters:
  - name: business_date
    type: date
    required: true
  - name: run_id
    type: string
    required: true
  - name: full_reload
    type: boolean
    required: false
    default: false
sources:
  - source_id: clients_raw
    source_type: csv
    path: "${storage.landing_root}/clients/"
    options:
      header: true
      inferSchema: true
      multiLine: false
    logical_name: clients
    alias: src_clients
targets:
  - target_id: clients_silver
    target_type: delta
    mode: overwrite
    catalog: "${databricks.default_catalog}"
    schema: risk
    table: clients_silver
    path: "${storage.silver_root}/risk/clients_silver"
steps:
  - step_id: read_clients
    step_type: read
    source_id: clients_raw
    output_df: clients_raw_df

  - step_id: standardize_column_names
    step_type: transformation
    transformation: rename_columns
    input_df: clients_raw_df
    output_df: clients_std_df
    params:
      mappings:
        ClientID: client_id
        FullName: full_name
        Segment: client_segment
        Country: country_code
        BirthDate: birth_date

  - step_id: cast_client_types
    step_type: transformation
    transformation: cast_columns
    input_df: clients_std_df
    output_df: clients_typed_df
    params:
      columns:
        client_id: string
        full_name: string
        client_segment: string
        country_code: string
        birth_date: date

  - step_id: derive_audit_columns
    step_type: transformation
    transformation: derive_columns
    input_df: clients_typed_df
    output_df: clients_enriched_df
    params:
      expressions:
        business_date: "to_date('{{ runtime.business_date }}')"
        ingestion_ts: "current_timestamp()"

  - step_id: deduplicate_clients
    step_type: transformation
    transformation: deduplicate
    input_df: clients_enriched_df
    output_df: clients_final_df
    params:
      key_columns: [client_id]
      order_by:
        - column: ingestion_ts
          direction: desc

dq:
  apply_to: clients_final_df
  include_rulepacks:
    - common_validations
    - client_validations
  rules: []
write:
  input_df: clients_final_df
  target_id: clients_silver
post_write_checks:
  - check_type: row_count_reconciliation
    expected_relation: output_lte_input
